services:
  mongodb:
    build:
      context: ./ex1
      dockerfile: Dockerfile.mongo
    container_name: mongodb_autorepair
    networks:
      - autorepair-network

  api:
    build:
      context: ./ex1
      dockerfile: Dockerfile
    container_name: api_autorepair
    ports:
      - "16025:16025"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/autoRepair
    depends_on:
      - mongodb
    networks:
      - autorepair-network

  interface:
    build:
      context: ./ex2
      dockerfile: Dockerfile
    container_name: interface_autorepair
    ports:
      - "16026:16026"
    environment:
      - API_URL=http://api_autorepair:16025
    depends_on:
      - api
    networks:
      - autorepair-network

networks:
  autorepair-network:
    driver: bridge
